<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Aplicación</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f4f6f7;
            --muted-text: #7f8c8d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .share-card {
            background: white;
            max-width: 360px;
            width: 100%;
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 0.95rem;
            color: var(--muted-text);
            line-height: 1.5;
        }

        /* Contenedor del QR */
        .qr-container {
            margin: 30px auto;
            width: 220px;
            height: 220px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            padding: 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Botón de regreso con estilo sutil */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 20px;
            background-color: #f0f3f4;
            transition: background-color 0.2s;
        }

        .btn-back:active {
            background-color: #e5e8e9;
        }
    </style>
</head>
<body>

    <div class="share-card">
        <h1>Compartir Aplicación</h1>
        <p>Escanea el código QR para abrir la página.</p>

        <!-- Tu imagen QR (debe estar guardada como qr.png en la carpeta share) -->
        <div class="qr-container">
            <img src="qr.png" alt="Código QR de la aplicación">
        </div>

        <!-- Regresar al index de forma limpia -->
        <a href="../index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Volver al Inicio
        </a>
    </div>

</body>
</html>
